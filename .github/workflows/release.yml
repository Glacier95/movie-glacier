name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a main-branch publication finish before the next run starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            arch: x64
          - target: mac-arm64
            os: macos-15
            arch: arm64
          - target: mac-x64
            os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Run unit tests
        run: pnpm test
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Package macOS installers
        if: runner.os == 'macOS'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          # Use the configured ad-hoc identity; no signing credentials are supplied.
          CSC_FOR_PULL_REQUEST: 'true'
        run: node scripts/dist-mac.cjs "--$TARGET_ARCH"
      - name: Verify macOS package
        if: runner.os == 'macOS'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const { executable, artifacts } = JSON.parse(fs.readFileSync('.cache/mac-package.json', 'utf8'));
          execFileSync('codesign', ['--verify', '--deep', '--strict', path.resolve(executable, '../../..')], { stdio: 'inherit' });
          for (const artifact of artifacts.filter(name => name.endsWith('.dmg'))) {
            execFileSync('hdiutil', ['verify', path.join('release', artifact)], { stdio: 'inherit' });
          }
          JS
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check application version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.publish == 'true'
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs publish
